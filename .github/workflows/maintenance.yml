name: maintenance
# Sunday 06:00 UTC: refresh the 60-day token (needs GH_PAT to save it back),
# then pull the numbers for posts from the last 35 days.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
concurrency: { group: queue, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Refresh token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 ig.py refresh-token
      - name: Numbers
        if: always()
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 ig.py stats
      - name: Save numbers
        if: always()
        run: |
          git config user.name ig-autopilot
          git config user.email ig-autopilot@users.noreply.github.com
          git add queue stats
          git diff --cached --quiet || { git commit -m "stats: $(date -u +%F)" && git pull --rebase -q && git push -q; }
